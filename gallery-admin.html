<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Gallery Admin | Grace & Grit Home Co.</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --burg:#7a2a35;--burg-dark:#541c23;--burg-light:#a84050;
  --cream:#fdf8f0;--cream-dark:#f0e8d8;
  --gold:#b8894a;--gold-light:#d4a96a;
  --charcoal:#2c2418;--text:#3d2e1e;--text-light:#6b5a46;
  --white:#fff;--border:#d4c4b0;--red:#c0392b;--green:#27ae60;
}
body{font-family:'Nunito',sans-serif;background:var(--cream);color:var(--text);min-height:100vh;}
nav{position:fixed;top:0;width:100%;z-index:100;background:rgba(44,36,24,0.97);backdrop-filter:blur(8px);box-shadow:0 2px 18px rgba(0,0,0,0.4);}
.nav-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0.7rem 1.5rem;}
.nav-logo{font-family:'Playfair Display',serif;color:var(--gold-light);font-size:1.15rem;font-weight:700;text-decoration:none;}
.nav-logo span{color:var(--white);font-style:italic;}
.nav-links{display:flex;gap:1.4rem;list-style:none;}
.nav-links a{color:rgba(255,255,255,0.8);text-decoration:none;font-size:0.82rem;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;transition:color 0.2s;}
.nav-links a:hover,.nav-links a.active{color:var(--gold-light);}
@media(max-width:760px){.nav-links{display:none;}}
.admin-wrap{max-width:1100px;margin:0 auto;padding:6.5rem 1.25rem 4rem;}
.admin-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;flex-wrap:wrap;gap:0.75rem;}
.admin-head h1{font-family:'Playfair Display',serif;color:var(--charcoal);font-size:1.7rem;}
.admin-head h1 em{color:var(--burg);font-style:italic;}
.logout-btn{background:transparent;border:1.5px solid var(--border);color:var(--text-light);font-family:'Nunito',sans-serif;font-size:0.8rem;font-weight:700;padding:0.4rem 1rem;border-radius:20px;cursor:pointer;}
.logout-btn:hover{border-color:var(--burg);color:var(--burg);}
.add-card,.list-card{background:var(--white);border-radius:16px;box-shadow:0 4px 24px rgba(44,36,24,0.08);padding:1.75rem;margin-bottom:2rem;}
.section-label{font-size:0.72rem;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold);margin-bottom:1.25rem;}
.form-row{margin-bottom:1rem;}
.form-row label{display:block;font-size:0.8rem;font-weight:700;color:var(--text);margin-bottom:0.35rem;}
.form-row input[type=text],.form-row select,.form-row textarea{
  width:100%;padding:0.65rem 0.85rem;border:1.5px solid var(--border);border-radius:10px;
  font-family:'Nunito',sans-serif;font-size:0.9rem;color:var(--text);background:var(--cream);outline:none;
}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:var(--gold);}
.form-row textarea{resize:vertical;min-height:70px;}
.upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem;}
@media(max-width:560px){.upload-grid{grid-template-columns:1fr;}}
.upload-box{border:2px dashed var(--border);border-radius:12px;overflow:hidden;background:var(--cream-dark);}
.upload-label{display:block;font-size:0.72rem;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-light);padding:0.6rem 0.85rem 0;}
.upload-box input[type=file]{display:block;width:100%;padding:0.5rem 0.85rem;font-size:0.82rem;font-family:'Nunito',sans-serif;color:var(--text-light);cursor:pointer;border:none;background:none;}
.preview{min-height:130px;display:flex;align-items:center;justify-content:center;background:var(--cream-dark);color:var(--text-light);font-size:0.75rem;text-align:center;}
.preview img{width:100%;max-height:190px;object-fit:cover;display:block;}
.save-btn{width:100%;background:var(--burg);color:var(--white);border:none;border-radius:12px;padding:0.9rem;font-family:'Nunito',sans-serif;font-size:0.95rem;font-weight:800;letter-spacing:0.04em;cursor:pointer;transition:all 0.2s;}
.save-btn:hover{background:var(--burg-dark);}
.save-btn:disabled{opacity:0.6;cursor:wait;}
.save-msg{margin-top:0.9rem;font-size:0.85rem;font-weight:700;color:var(--text-light);}
.save-msg.success{color:var(--green);}
.save-msg.error{color:var(--red);}
#projectList .loading-msg{color:var(--text-light);font-size:0.9rem;}
#projectList .empty-msg{color:var(--text-light);font-size:0.9rem;}
.proj-card{display:flex;gap:1rem;align-items:center;border:1.5px solid var(--border);border-radius:12px;padding:0.85rem;margin-bottom:0.75rem;background:var(--cream);}
.proj-thumbs{display:flex;gap:0.5rem;flex-shrink:0;}
.proj-thumb-wrap{position:relative;width:70px;height:52px;border-radius:8px;overflow:hidden;background:var(--cream-dark);}
.proj-thumb-wrap img{width:100%;height:100%;object-fit:cover;}
.proj-thumb-tag{position:absolute;bottom:2px;left:2px;font-size:0.5rem;font-weight:800;letter-spacing:0.05em;text-transform:uppercase;background:rgba(44,36,24,0.7);color:var(--white);padding:1px 4px;border-radius:3px;}
.proj-info{flex:1;min-width:0;}
.proj-info .p-title{font-family:'Playfair Display',serif;font-size:0.95rem;color:var(--charcoal);}
.proj-info .p-meta{font-size:0.72rem;color:var(--text-light);margin-top:0.15rem;}
.del-btn{background:transparent;border:1.5px solid var(--red);color:var(--red);font-family:'Nunito',sans-serif;font-size:0.72rem;font-weight:700;padding:0.35rem 0.8rem;border-radius:8px;cursor:pointer;flex-shrink:0;}
.del-btn:hover{background:var(--red);color:var(--white);}
/* Password gate */
#gate{position:fixed;inset:0;background:var(--charcoal);display:flex;align-items:center;justify-content:center;z-index:200;padding:1.5rem;}
#gate.hidden{display:none;}
.gate-box{background:var(--white);border-radius:16px;padding:2.25rem;width:100%;max-width:360px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.4);}
.gate-box h2{font-family:'Playfair Display',serif;color:var(--charcoal);margin-bottom:0.4rem;}
.gate-box p{font-size:0.82rem;color:var(--text-light);margin-bottom:1.4rem;}
.gate-box input{width:100%;padding:0.7rem 0.9rem;border:1.5px solid var(--border);border-radius:10px;font-size:0.95rem;text-align:center;outline:none;margin-bottom:0.9rem;font-family:'Nunito',sans-serif;}
.gate-box input:focus{border-color:var(--gold);}
.gate-box button{width:100%;background:var(--burg);color:var(--white);border:none;border-radius:10px;padding:0.75rem;font-weight:800;font-size:0.9rem;cursor:pointer;font-family:'Nunito',sans-serif;}
.gate-box button:hover{background:var(--burg-dark);}
#gateErr{color:var(--red);font-size:0.8rem;margin-top:0.6rem;display:none;}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="/" class="nav-logo"><span>Grace &amp;</span> Grit Home Co.</a>
    <ul class="nav-links">
      <li><a href="/gallery.html">View Gallery</a></li>
    </ul>
  </div>
</nav>

<!-- Password gate -->
<div id="gate">
  <div class="gate-box">
    <h2>Gallery Admin</h2>
    <p>Enter the admin password to manage projects.</p>
    <input type="password" id="pwInput" placeholder="Password" autocomplete="off">
    <button onclick="checkPassword()">Unlock</button>
    <div id="gateErr">Incorrect password. Try again.</div>
  </div>
</div>

<div class="admin-wrap" id="adminPanel">
  <div class="admin-head">
    <h1>Gallery <em>Admin</em></h1>
    <button class="logout-btn" onclick="logout()">Log out</button>
  </div>

  <div class="add-card">
    <div class="section-label">Add New Project</div>
    <div class="upload-grid">
      <div>
        <span class="upload-label">Before Photo</span>
        <div class="upload-box">
          <input type="file" id="beforeFile" accept="image/*" onchange="handlePhoto(this,'beforePreview','before')">
        </div>
        <div class="preview" id="beforePreview"><span style="padding:1rem;text-align:center;font-size:0.75rem;">Tap to choose photo</span></div>
      </div>
      <div>
        <span class="upload-label">After Photo</span>
        <div class="upload-box">
          <input type="file" id="afterFile" accept="image/*" onchange="handlePhoto(this,'afterPreview','after')">
        </div>
        <div class="preview" id="afterPreview"><span style="padding:1rem;text-align:center;font-size:0.75rem;">Tap to choose photo</span></div>
      </div>
    </div>
    <div class="form-row">
      <label>Project Title</label>
      <input type="text" id="projTitle" placeholder="e.g. Living Room Refresh">
    </div>
    <div class="form-row">
      <label>Category</label>
      <select id="projCat">
        <option value="outdoor">Outdoor</option>
        <option value="interior">Interior</option>
        <option value="kitchen">Kitchen &amp; Bath</option>
        <option value="repair">Repairs</option>
      </select>
    </div>
    <div class="form-row">
      <label>Description</label>
      <textarea id="projDesc" placeholder="What did you do? (short)"></textarea>
    </div>
    <button class="save-btn" id="saveBtn" onclick="addProject()">Save to Gallery</button>
    <div class="save-msg" id="saveMsg"></div>
  </div>

  <div class="list-card">
    <div class="section-label">Current Projects (<span id="projCount">0</span>)</div>
    <div id="projectList"><p class="loading-msg">Loading projects...</p></div>
  </div>
</div>

<script>
// ── Supabase config ──
const SUPABASE_URL = 'https://ljznxojddfnfwnedhxzu.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxqem54b2pkZGZuZnduZWRoeHp1Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3OTA5ODY5MSwiZXhwIjoyMDk0Njc0NjkxfQ.WoqkZDQPlOh305SkhqVi0EgK1BsyBi0rItzoh50I9og';
const BUCKET = 'gallery-photos';
const CAT_LABELS = {kitchen:'Kitchen & Bath', interior:'Interior', outdoor:'Outdoor', repair:'Repair'};

// Admin password — stored as SHA-256 hash (not plaintext)
// To change: replace this hash with SHA-256 of the new password
const ADMIN_PW_HASH = '9907dc0e7867712bf24f1b3ef2d0f9d7c2690854f6ea10dd35f0ff64e4d761d2';
const SESSION_KEY = 'gg_admin_auth';

// ── Supabase helpers (service role key bypasses RLS for writes) ──
async function sbFetch(path, opts={}) {
  const res = await fetch(SUPABASE_URL + path, {
    ...opts,
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      ...(opts.headers||{})
    }
  });
  return res;
}

async function sha256(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function uploadPhoto(file, slot) {
  const blob = await compressImage(file, 900, 0.78);
  const filename = `${Date.now()}_${slot}.jpg`;
  const res = await sbFetch(`/storage/v1/object/${BUCKET}/${filename}`, {
    method: 'POST',
    headers: { 'Content-Type': 'image/jpeg', 'x-upsert': 'true' },
    body: blob
  });
  if (!res.ok) throw new Error('Photo upload failed (' + res.status + ')');
  return `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${filename}`;
}

async function insertProject(data) {
  const res = await sbFetch('/rest/v1/projects', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
    body: JSON.stringify(data)
  });
  if (!res.ok) { const e = await res.text(); throw new Error(e); }
  return res.json();
}

async function fetchProjects() {
  const res = await sbFetch('/rest/v1/projects?order=created_at.desc&select=*');
  if (!res.ok) throw new Error('Could not load projects');
  return res.json();
}

async function deleteProjectFromDB(id, beforeUrl, afterUrl) {
  await sbFetch(`/rest/v1/projects?id=eq.${id}`, { method: 'DELETE' });
  const files = [beforeUrl, afterUrl].filter(Boolean).map(url => {
    const parts = url.split(`/${BUCKET}/`);
    return parts[1] || null;
  }).filter(Boolean);
  if (files.length) {
    await sbFetch(`/storage/v1/object/${BUCKET}`, {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prefixes: files })
    });
  }
}

// ── Password gate ──
async function checkPassword() {
  const input = document.getElementById('pwInput').value;
  const hash = await sha256(input);
  if (hash === ADMIN_PW_HASH) {
    sessionStorage.setItem(SESSION_KEY, '1');
    document.getElementById('gate').classList.add('hidden');
    renderProjects();
  } else {
    document.getElementById('gateErr').style.display = 'block';
    document.getElementById('pwInput').value = '';
    document.getElementById('pwInput').focus();
  }
}
function logout() { sessionStorage.removeItem(SESSION_KEY); window.location.href = '/'; }
document.getElementById('pwInput').addEventListener('keydown', e => { if (e.key === 'Enter') checkPassword(); });
if (sessionStorage.getItem(SESSION_KEY) === '1') {
  document.getElementById('gate').classList.add('hidden');
  renderProjects();
}

// ── Photo compression ──
const photoFiles = {};
function handlePhoto(input, previewId, slot) {
  const file = input.files[0];
  if (!file) return;
  photoFiles[slot] = file;
  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById(previewId).innerHTML = `<img src="${e.target.result}" alt="preview">`;
  };
  reader.readAsDataURL(file);
}

function compressImage(file, maxW, quality) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob(resolve, 'image/jpeg', quality);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ── Add project ──
async function addProject() {
  const title = document.getElementById('projTitle').value.trim();
  const cat   = document.getElementById('projCat').value;
  const desc  = document.getElementById('projDesc').value.trim();

  if (!title) { showMsg('Please enter a project title.', 'error'); return; }
  if (!photoFiles.before && !photoFiles.after) { showMsg('Please add at least one photo.', 'error'); return; }

  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.textContent = 'Uploading...';

  try {
    let beforeUrl = '', afterUrl = '';
    if (photoFiles.before) { showMsg('Uploading before photo...', ''); beforeUrl = await uploadPhoto(photoFiles.before, 'before'); }
    if (photoFiles.after)  { showMsg('Uploading after photo...', '');  afterUrl  = await uploadPhoto(photoFiles.after,  'after');  }

    showMsg('Saving project...', '');
    await insertProject({ title, cat, cat_label: CAT_LABELS[cat]||cat, desc, before_url: beforeUrl, after_url: afterUrl });

    document.getElementById('projTitle').value = '';
    document.getElementById('projDesc').value  = '';
    document.getElementById('beforeFile').value = '';
    document.getElementById('afterFile').value  = '';
    document.getElementById('beforePreview').innerHTML = '<span style="padding:1rem;text-align:center;font-size:0.75rem;">Tap to choose photo</span>';
    document.getElementById('afterPreview').innerHTML  = '<span style="padding:1rem;text-align:center;font-size:0.75rem;">Tap to choose photo</span>';
    delete photoFiles.before;
    delete photoFiles.after;

    showMsg('Saved! Project is live on the gallery.', 'success');
    renderProjects();
  } catch(e) {
    showMsg('Error: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Save to Gallery';
  }
}

function showMsg(msg, type) {
  const el = document.getElementById('saveMsg');
  el.textContent = msg;
  el.className = 'save-msg' + (type ? ' ' + type : '');
  if (type === 'success' || type === 'error') {
    setTimeout(() => { el.textContent = ''; el.className = 'save-msg'; }, 5000);
  }
}

// ── Delete project ──
async function deleteProject(id, beforeUrl, afterUrl) {
  if (!confirm('Remove this project from the gallery?')) return;
  try {
    await deleteProjectFromDB(id, beforeUrl, afterUrl);
    renderProjects();
  } catch(e) {
    alert('Delete failed: ' + e.message);
  }
}

// ── Render project list ──
async function renderProjects() {
  const list = document.getElementById('projectList');
  list.innerHTML = '<p class="loading-msg">Loading projects...</p>';
  try {
    const projects = await fetchProjects();
    document.getElementById('projCount').textContent = projects.length;
    if (!projects.length) {
      list.innerHTML = '<p class="empty-msg">No projects yet — add one above and it will show up on the public gallery.</p>';
      return;
    }
    list.innerHTML = projects.map(p => `
      <div class="proj-card">
        <div class="proj-thumbs">
          <div class="proj-thumb-wrap">
            <span class="proj-thumb-tag before-tag">Before</span>
            ${p.before_url ? `<img src="${p.before_url}" alt="before">` : ''}
          </div>
          <div class="proj-thumb-wrap">
            <span class="proj-thumb-tag after-tag">After</span>
            ${p.after_url ? `<img src="${p.after_url}" alt="after">` : ''}
          </div>
        </div>
        <div class="proj-info">
          <div class="p-title">${p.title}</div>
          <div class="p-meta">${p.cat_label || p.cat}${p.desc ? ' — ' + p.desc : ''}</div>
        </div>
        <button class="del-btn" onclick="deleteProject('${p.id}','${p.before_url||''}','${p.after_url||''}')">Delete</button>
      </div>
    `).join('');
  } catch(e) {
    list.innerHTML = '<p class="empty-msg">Could not load projects: ' + e.message + '</p>';
  }
}
</script>
</body>
</html>
